name: Publish to PyPI

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml
  publish:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kippy-api
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
